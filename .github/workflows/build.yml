name: build

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install Crystal
        if: matrix.target != 'x86_64-pc-windows-gnu'
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Crystal (MinGW64)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-crystal
            mingw-w64-x86_64-shards
            make
            git
            zip

      - name: Set version variables
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${{ github.ref_name }}
          else
            VERSION="build-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BIN=meru" >> $GITHUB_ENV

      - name: Install dependencies
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: make deps-prod

      - name: Install dependencies (MinGW64)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: msys2 {0}
        run: make deps-prod

      - name: Build on Linux
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          docker run -d --name alpine -v $(pwd):/workspace -w /workspace crystallang/crystal:latest-alpine tail -f /dev/null
          docker exec alpine apk add make readline-dev readline-static ncurses-dev ncurses-static ncurses-libs
          docker exec --user "$(id -u):$(id -g)" alpine make deps-prod
          docker exec --user "$(id -u):$(id -g)" alpine make build release=1 static=1
          docker exec alpine chmod +x bin/$BIN
          ldd bin/$BIN || echo "Static binary (no dynamic dependencies)"
          file bin/$BIN
          make smoke-built
          make package-built VERSION=$VERSION TARGET=${{ matrix.target }}

      - name: Build on macOS
        if: startsWith(matrix.target, 'x86_64-apple-darwin') || startsWith(matrix.target, 'aarch64-apple-darwin')
        shell: bash
        run: |
          make build release=1
          chmod +x bin/$BIN
          otool -L bin/$BIN
          file bin/$BIN
          make smoke-built
          make package-built VERSION=$VERSION TARGET=${{ matrix.target }}

      - name: Verify and test on Unix
        if: matrix.target == 'x86_64-unknown-linux-musl' || startsWith(matrix.target, 'x86_64-apple-darwin') || startsWith(matrix.target, 'aarch64-apple-darwin')
        shell: bash
        run: |
          make smoke-built
          make spec

      - name: Build on Windows (MSVC)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          make build release=1 static=1 BIN_EXT=.exe
          make smoke-built BIN_EXT=.exe
          make package-built VERSION=$env:VERSION TARGET=${{ matrix.target }} BIN_EXT=.exe ARCHIVE_FORMAT=zip

      - name: Verify and test on Windows (MSVC)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          make smoke-built BIN_EXT=.exe
          make spec

      - name: Build on Windows (MinGW64)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: msys2 {0}
        run: |
          make build release=1 static=1 BIN_EXT=.exe
          file bin/$BIN.exe
          make smoke-built BIN_EXT=.exe
          make package-built VERSION=$VERSION TARGET=${{ matrix.target }} BIN_EXT=.exe ARCHIVE_FORMAT=zip

      - name: Verify and test on Windows (MinGW64)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: msys2 {0}
        run: |
          make smoke-built BIN_EXT=.exe
          make spec

      - name: Upload artifacts (non-release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: meru-${{ matrix.target }}
          path: |
            meru-*.tar.gz
            meru-*.zip

      - name: Upload release assets (release only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            meru-*.tar.gz
            meru-*.zip
